# conda 환경 정의: 이 프로젝트 전용
#
#   conda env create -f environment.yml
#   conda activate hippo
#
# 결과를 만든 환경의 실제 설치 목록을 그대로 옮겨 적었다.
#
# GPU: NVIDIA RTX 4090 (VRAM 24GB) / CUDA 13.2 기준.
# 다른 CUDA 버전이면 https://pytorch.org/get-started/locally/ 에서 인덱스 URL을 바꿀 것.

name: hippo

channels:
  - defaults

dependencies:
  - python=3.13
  - pip
  - pip:
      # ── PyTorch (CUDA 13.2) ─────────────────────────────────────
      # torch 휠은 자체 CUDA 런타임을 담고 있어 시스템 툴킷이 없어도 GPU 가 돈다.
      # 시스템 nvcc 가 필요한 것은 커널을 직접 컴파일할 때뿐이다.
      - --index-url https://download.pytorch.org/whl/cu132
      - torch==2.14.0+cu132
      - torchvision==0.29.0+cu132

      # ── 나머지는 PyPI 기본 인덱스 ────────────────────────────────
      - --extra-index-url https://pypi.org/simple

      # 의료영상 분할 프레임워크. 3D UNet, SegResNet, SwinUNETR 와 DiceCE 손실,
      # sliding-window 추론이 전부 여기서 온다.
      - monai==1.6.0
      - einops==0.8.2          # monai 의 트랜스포머 계열이 요구한다
      - nibabel==5.4.2         # NIfTI 입출력

      # 수치, 데이터
      - numpy==2.5.3
      - scipy==1.18.1
      - scikit-learn==1.9.0
      # 화질 저하 부가 분석(scripts/run_degradation.py): 3D 비국소 평균, N4 바이어스 보정
      - scikit-image==0.26.0
      - SimpleITK==2.5.6
      - PyWavelets==1.10.0   # skimage 의 잡음 추정(estimate_sigma)이 요구한다
      - pandas==3.0.5

      # 설정, CLI
      - omegaconf==2.3.1
      - typer==0.27.2

      # 그림, 리포트
      - matplotlib==3.11.1
      - seaborn==0.13.2
      - reportlab==5.0.1

      # 데이터 내려받기 (MSD Task04 는 Google Drive 배포다)
      - gdown==6.2.0
      - tqdm==4.70.0

      # 배포 경로. ONNX 로 내보내고 원본과 출력이 같은지 대조한 뒤
      # TensorRT FP16 엔진까지 만든다.
      #
      # onnxruntime 은 GPU 판만 설치한다. CPU 판과 함께 깔면 어느 쪽이 잡히는지
      # 불분명해지고, CPU 판만 있으면 ONNXRuntime 이 GPU 대신 CPU 에서 돌아
      # 지연 비교 표가 "GPU 대 CPU" 가 된다.
      - onnx==1.22.0
      - onnxscript==0.7.1
      - onnxruntime-gpu==1.30.0
      # TensorRT. CUDA 13 용 빌드다.
      - tensorrt-cu13==11.3.0.99

      # 개발
      - pytest==9.1.1
      - ruff==0.16.6
      # 선언끼리 모순되는지 검사할 때 버전 조건을 파싱한다
      - packaging==26.3
